<div
  class="bg-primary-lightBlue text-secondary-neutral-mineShaft py-[100px] xl:py-[150px] text-center w-full min-h-full flex flex-col items-center justify-between gap-8"
>
  <h5 class="flex text-40 mt-1" style="font-size: clamp(16px, 6.5vw, 40px)">
    {{ 'ADOPTION_FAILED_TITLE' | translate | uppercase }}
  </h5>

  <div class="mt-3 flex flex-col max-w-[360px]">
    <p class="text-sm ml-3 leading-snug text-left">
      {{ 'ADOPTION_FAILED_MESSAGE' | translate }}
    </p>
  </div>
  <div
    class="mt-1 flex-1 flex justify-center items-center w-ful h-full transform scale-[0.7] sm:scale-[0.8] lg:scale-[1]"
  >
    <app-icon
      [name]="'logoFailure'"
      class="relative text-primary-beige"
    ></app-icon>
  </div>

  <!-- Submit -->
  <div class="flex content-center mt-2 sm:mt-4">
    <app-primary-large-button
      class="w-[260px]"
      buttonTitle="WRITE_US"
      (pressButton)="goToFeedbackForm()"
    ></app-primary-large-button>
  </div>
</div>
